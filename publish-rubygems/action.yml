name: "Publish Ruby SDK to RubyGems"
description: "Publish a Ruby SDK to RubyGems using OIDC trusted publishing"
inputs:
  ruby-directory:
    description: "Directory containing the Ruby SDK"
    required: true
  ruby-version:
    description: "Ruby version to use"
    required: false
    default: "3.2"
  speakeasy_api_key:
    description: "The Speakeasy API key for logging publish events"
    required: true
  github_access_token:
    description: "A GitHub access token"
    required: true
  speakeasy_server_url:
    description: "Speakeasy server URL (internal use)"
    required: false
  working_directory:
    description: "Working directory for Speakeasy CLI commands"
    required: false
  slack_webhook_url:
    description: "Slack webhook URL for failure notifications"
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout sdk-generation-action repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: speakeasy-api/sdk-generation-action
        ref: dc3edb30f73aace3b7ad2849d5a5a7d4db46448d
        path: _speakeasy
    - name: Set up Ruby
      uses: ruby/setup-ruby@d8d83c3960843afb664e821fed6be52f37da5267 # v1.231.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
    - name: Build gem
      shell: bash
      working-directory: ${{ inputs.ruby-directory }}
      run: |
        bundle install
        gem build *.gemspec
    - name: Configure RubyGems credentials (Trusted Publishing)
      uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
    - name: Publish to RubyGems (Trusted Publishing)
      id: publish
      shell: bash
      working-directory: ${{ inputs.ruby-directory }}
      run: gem push *.gem
    - name: Log publish event
      id: publish-event
      if: always()
      uses: ./_speakeasy
      with:
        github_access_token: ${{ inputs.github_access_token }}
        action: publish-event
        speakeasy_api_key: ${{ inputs.speakeasy_api_key }}
        working_directory: ${{ inputs.working_directory }}
        speakeasy_server_url: ${{ inputs.speakeasy_server_url }}
        target_directory: ${{ inputs.ruby-directory }}
        registry_name: "gems"
      env:
        GH_ACTION_RESULT: ${{ steps.publish.outcome }}
    - name: Notify Slack on failure
      if: always() && failure() && inputs.slack_webhook_url != ''
      uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
      with:
        status: failure
        token: ${{ inputs.github_access_token }}
        notify_when: "failure"
        notification_title: "Failed to publish Ruby SDK to RubyGems"
        message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
        footer: "Linked Repo <{repo_url}|{repo}> | <{run_url}|View Run>"
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
    - name: Log result
      id: log-result
      if: always()
      uses: ./_speakeasy
      with:
        github_access_token: ${{ inputs.github_access_token }}
        action: log-result
        speakeasy_api_key: ${{ inputs.speakeasy_api_key }}
        working_directory: ${{ inputs.working_directory }}
        speakeasy_server_url: ${{ inputs.speakeasy_server_url }}
      env:
        GH_ACTION_RESULT: ${{ steps.publish.outcome }}
        GH_ACTION_STEP: publish-rubygems
        TARGET_TYPE: "sdk"
