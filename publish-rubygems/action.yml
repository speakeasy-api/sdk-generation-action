name: "Publish Ruby SDK to RubyGems"
description: "Publish a Ruby SDK to RubyGems using OIDC trusted publishing"
inputs:
  ruby-directory:
    description: "Directory containing the Ruby SDK"
    required: true
  ruby-version:
    description: "Ruby version to use"
    required: false
    default: "3.2"
  rubygems-owner:
    description: "rubygems.org account (username or immutable account ID) that owns the gem. Only required for the first push of a gem registered through a pending trusted publisher."
    required: false
  speakeasy_api_key:
    description: "The Speakeasy API key for logging publish events"
    required: true
  github_access_token:
    description: "A GitHub access token"
    required: true
  speakeasy_server_url:
    description: "Speakeasy server URL (internal use)"
    required: false
  working_directory:
    description: "Working directory for Speakeasy CLI commands"
    required: false
  slack_webhook_url:
    description: "Slack webhook URL for failure notifications"
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout sdk-generation-action repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: speakeasy-api/sdk-generation-action
        ref: 85dc1201bad764986298467d26d853eb3fb568d9
        path: _speakeasy
    - name: Set up Ruby
      uses: ruby/setup-ruby@d8d83c3960843afb664e821fed6be52f37da5267 # v1.231.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
    - name: Build gem
      shell: bash
      working-directory: ${{ inputs.ruby-directory }}
      run: |
        bundle install
        gem build *.gemspec
    - name: Log in to RubyGems (Trusted Publishing)
      id: login
      shell: bash
      env:
        RUBYGEMS_OWNER: ${{ inputs.rubygems-owner }}
      run: |
        id_token=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r '.value')
        if [ -z "${id_token}" ] || [ "${id_token}" = "null" ]; then
          echo "::error::Could not obtain a GitHub OIDC token. The publish-rubygems job needs the id-token: write permission."
          exit 1
        fi
        body=$(jq -cn --arg jwt "${id_token}" --arg owner "${RUBYGEMS_OWNER}" '{jwt: $jwt} + (if $owner == "" then {} else {owner: $owner} end)')
        response=$(curl -sS -X POST -H "Content-Type: application/json" -H "Accept: application/json" -d "${body}" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
        api_key=$(printf '%s' "${response}" | jq -r '.rubygems_api_key // empty')
        if [ -z "${api_key}" ]; then
          echo "::error::rubygems.org did not issue an API key for this workflow. Check the trusted publisher's repository, workflow filename and environment, and set rubygems-owner for the first push of a new gem. Response: ${response}"
          exit 1
        fi
        echo "::add-mask::${api_key}"
        echo "api-key=${api_key}" >> "${GITHUB_OUTPUT}"
    - name: Publish to RubyGems (Trusted Publishing)
      id: publish
      shell: bash
      working-directory: ${{ inputs.ruby-directory }}
      env:
        GEM_HOST_API_KEY: ${{ steps.login.outputs.api-key }}
      run: gem push *.gem
    - name: Log publish event
      id: publish-event
      if: always()
      uses: ./_speakeasy
      with:
        github_access_token: ${{ inputs.github_access_token }}
        action: publish-event
        speakeasy_api_key: ${{ inputs.speakeasy_api_key }}
        working_directory: ${{ inputs.working_directory }}
        speakeasy_server_url: ${{ inputs.speakeasy_server_url }}
        target_directory: ${{ inputs.ruby-directory }}
        registry_name: "gems"
      env:
        GH_ACTION_RESULT: ${{ steps.publish.outcome }}
    - name: Notify Slack on failure
      if: always() && failure() && inputs.slack_webhook_url != ''
      uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
      with:
        status: failure
        token: ${{ inputs.github_access_token }}
        notify_when: "failure"
        notification_title: "Failed to publish Ruby SDK to RubyGems"
        message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
        footer: "Linked Repo <{repo_url}|{repo}> | <{run_url}|View Run>"
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
    - name: Log result
      id: log-result
      if: always()
      uses: ./_speakeasy
      with:
        github_access_token: ${{ inputs.github_access_token }}
        action: log-result
        speakeasy_api_key: ${{ inputs.speakeasy_api_key }}
        working_directory: ${{ inputs.working_directory }}
        speakeasy_server_url: ${{ inputs.speakeasy_server_url }}
      env:
        GH_ACTION_RESULT: ${{ steps.publish.outcome }}
        GH_ACTION_STEP: publish-rubygems
        TARGET_TYPE: "sdk"
