name: "Publish C# SDK to NuGet"
description: "Publish a C# SDK to NuGet using OIDC trusted publishing"
inputs:
  csharp-directory:
    description: "Directory containing the C# SDK"
    required: true
  dotnet-version:
    description: "Version of dotnet to use when compiling the C# SDK"
    required: false
    default: "5.x"
  nuget-username:
    description: "The nuget.org username (profile name) that owns the trusted publishing policy"
    required: true
  speakeasy_api_key:
    description: "The Speakeasy API key for logging publish events"
    required: true
  github_access_token:
    description: "A GitHub access token"
    required: true
  speakeasy_server_url:
    description: "Speakeasy server URL (internal use)"
    required: false
  working_directory:
    description: "Working directory for Speakeasy CLI commands"
    required: false
  slack_webhook_url:
    description: "Slack webhook URL for failure notifications"
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout sdk-generation-action repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: speakeasy-api/sdk-generation-action
        ref: 36d2c7011ebf6999afe2b8ca51a4137905811f30
        path: _speakeasy
    - name: Setup dotnet from global.json
      if: hashFiles(format('{0}/global.json', inputs.csharp-directory)) != ''
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
      with:
        global-json-file: ${{ inputs.csharp-directory }}/global.json
    - name: Setup dotnet
      if: hashFiles(format('{0}/global.json', inputs.csharp-directory)) == ''
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Build package
      shell: bash
      working-directory: ${{ inputs.csharp-directory }}
      run: dotnet pack -c Release -o .
    - name: Log in to NuGet (Trusted Publishing)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nuget-username }}
    - name: Publish to NuGet (Trusted Publishing)
      id: publish
      shell: bash
      working-directory: ${{ inputs.csharp-directory }}
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push *.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
    - name: Log publish event
      id: publish-event
      if: always()
      uses: ./_speakeasy
      with:
        github_access_token: ${{ inputs.github_access_token }}
        action: publish-event
        speakeasy_api_key: ${{ inputs.speakeasy_api_key }}
        working_directory: ${{ inputs.working_directory }}
        speakeasy_server_url: ${{ inputs.speakeasy_server_url }}
        target_directory: ${{ inputs.csharp-directory }}
        registry_name: "nuget"
      env:
        GH_ACTION_RESULT: ${{ steps.publish.outcome }}
    - name: Notify Slack on failure
      if: always() && failure() && inputs.slack_webhook_url != ''
      uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
      with:
        status: failure
        token: ${{ inputs.github_access_token }}
        notify_when: "failure"
        notification_title: "Failed to publish C# SDK to NuGet"
        message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
        footer: "Linked Repo <{repo_url}|{repo}> | <{run_url}|View Run>"
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
    - name: Log result
      id: log-result
      if: always()
      uses: ./_speakeasy
      with:
        github_access_token: ${{ inputs.github_access_token }}
        action: log-result
        speakeasy_api_key: ${{ inputs.speakeasy_api_key }}
        working_directory: ${{ inputs.working_directory }}
        speakeasy_server_url: ${{ inputs.speakeasy_server_url }}
      env:
        GH_ACTION_RESULT: ${{ steps.publish.outcome }}
        GH_ACTION_STEP: publish-nuget
        TARGET_TYPE: "sdk"
